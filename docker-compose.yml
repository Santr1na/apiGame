version: '3.8'

services:
  game-api:
    build: .
    container_name: game-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - USE_DATABASE=true
    env_file:
      - .env
    volumes:
      # Persist database
      - ./games.db:/app/games.db
      # Logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
